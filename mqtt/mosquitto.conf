# Vizion broker, native install on the Pi: copied to /etc/mosquitto/conf.d/vizion.conf by setup_broker.sh.
# TLS only, passwords required, per-user topic rights. There is no plain-text listener on 8883.
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

listener 8883
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.2
